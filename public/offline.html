<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D3461">
<title>연결 끊김 | IM 뉴스룸</title>
<style>
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #1D3461; color: #fff;
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; text-align: center; }
  main { padding: 32px 24px; max-width: 360px; }
  img { width: 168px; height: auto; display: block; margin: 0 auto 36px; }
  h1, p { word-break: keep-all; text-wrap: balance; }
  h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  p { margin: 12px 0 0; font-size: 15px; line-height: 1.7; color: #C9D2E3; }
  button { margin-top: 28px; appearance: none; border: 0; border-radius: 10px; background: #F2B544; color: #1D3461;
    font: inherit; font-size: 16px; font-weight: 800; padding: 13px 28px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/brand/im-newsroom-mark.svg" alt="IM 뉴스룸">
  <h1>인터넷에 연결되어 있지 않습니다</h1>
  <p>와이파이나 모바일 데이터를 확인한 뒤 다시 시도해 주세요. 쓰던 기사는 편집국에 마지막으로 저장한 내용까지 남아 있습니다.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>
