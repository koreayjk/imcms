<!-- Supabase → Authentication → Emails → Templates → Reset Password 의 Message body 에 붙여 넣기
     Subject: [IM 뉴스룸] 비밀번호 재설정 안내
     링크는 우리 주소(app.imnewsroom.com/auth/confirm)로 보낸다 — 보낸 도메인과 링크 도메인이 같아야 스팸으로 덜 분류된다
     긴 인증 주소를 본문에 그대로 드러내지 않는다 (스팸 필터가 피싱 메일로 의심하는 모양) -->
<div style="margin:0;padding:24px 12px;background:#F6F8FB;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#0F1B33">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #D9E1EE;border-radius:12px">
    <tr>
      <td style="padding:28px 28px 8px">
        <p style="margin:0;font-size:18px;font-weight:800;letter-spacing:-0.02em">IM 뉴스룸</p>
      </td>
    </tr>
    <tr>
      <td style="padding:12px 28px 4px">
        <h1 style="margin:0;font-size:22px;line-height:1.4;font-weight:800;letter-spacing:-0.03em">비밀번호를 새로 정해 주세요</h1>
        <p style="margin:14px 0 0;font-size:15px;line-height:1.7;color:#4A5873">
          <b style="color:#0F1B33">{{ .Email }}</b> 계정의 비밀번호 재설정을 요청하셨습니다.<br>
          아래 버튼을 누르면 새 비밀번호를 정하는 화면이 열립니다.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:24px 28px">
        <a href="https://app.imnewsroom.com/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/login/reset"
           style="display:inline-block;background:#1F4FD0;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:13px 26px;border-radius:8px">새 비밀번호 정하기</a>
      </td>
    </tr>
    <tr>
      <td style="padding:0 28px 24px;font-size:13px;line-height:1.7;color:#6B7690">
        이 버튼은 1시간 동안 한 번만 쓸 수 있습니다. 시간이 지났다면 편집국 로그인 화면의 “비밀번호 찾기”에서 다시 요청해 주세요.<br>
        직접 요청하지 않았다면 이 메일은 무시하셔도 됩니다. 비밀번호는 바뀌지 않습니다.
      </td>
    </tr>
    <tr>
      <td style="padding:16px 28px 24px;border-top:1px solid #EEF3FD;font-size:12px;line-height:1.7;color:#8A94A8">
        IM 뉴스룸 · <a href="https://imnewsroom.com" style="color:#8A94A8">imnewsroom.com</a><br>
        문의: <a href="mailto:contact@imnewsroom.com" style="color:#8A94A8">contact@imnewsroom.com</a>
      </td>
    </tr>
  </table>
</div>
